[package]
name = "dsh-launcher"
version = "0.1.0"
description = "A lightweight launcher for DSH Web"
license = "MIT"
authors = ["DSH Launcher"]
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
