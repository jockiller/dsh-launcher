name: Build desktop packages

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            rust-target: aarch64-apple-darwin
            bundles: app
            artifact: macos-arm64
            updater-arch: aarch64
            paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*_aarch64.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*_aarch64.app.tar.gz.sig
          - name: macOS x64
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
            bundles: app
            artifact: macos-x64
            updater-arch: x86_64
            paths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*_x86_64.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*_x86_64.app.tar.gz.sig
          - name: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            updater-arch: x86_64
            paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: Windows arm64
            os: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            bundles: nsis
            artifact: windows-arm64
            updater-arch: aarch64
            paths: |
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: Linux x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: linux-x64
            updater-arch: ""
            paths: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
          - name: Linux arm64
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact: linux-arm64
            updater-arch: ""
            paths: |
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify updater signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 未配置：createUpdaterArtifacts 已开启，构建无法为热更包签名。请先运行 pnpm tauri signer generate 并把私钥写入仓库 Secrets。"
            exit 1
          fi

      - name: Build desktop package
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          elif [[ -z "$APPLE_SIGNING_IDENTITY" ]]; then
            unset APPLE_SIGNING_IDENTITY
          fi
          pnpm exec tauri build --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}

      - name: Sign macOS app and create DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bundle_dir="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          app=$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -print -quit)
          if [[ -z "$app" ]]; then
            echo "No macOS app bundle was generated for ${{ matrix.rust-target }}." >&2
            exit 1
          fi

          # tauri 自动生成的热更包在补签之前打包。为了让替换后的 bundle 保留本地网络
          # 权限元数据（sign-macos-app.sh 的补签），顺序必须是：补签 .app → 用补签后的
          # .app 打包成最终热更包 → 对该最终 tarball 签名（gzip 头含时间戳，两次打包
          # 字节不同，先签后改会导致校验失败）→ 删除 tauri 自动生成的旧产物。
          rm -f "$bundle_dir/macos/$(basename "$app").tar.gz" \
                "$bundle_dir/macos/$(basename "$app").tar.gz.sig"

          scripts/sign-macos-app.sh "$app"

          tarball_base="DSH_Launcher_${{ matrix.updater-arch }}.app.tar.gz"
          rm -f "$bundle_dir/macos/$tarball_base" "$bundle_dir/macos/$tarball_base.sig"
          tar -czf "$bundle_dir/macos/$tarball_base" -C "$(dirname "$app")" "$(basename "$app")"
          pnpm exec tauri signer sign "$bundle_dir/macos/$tarball_base"

          dmg_dir="$bundle_dir/dmg"
          stage="$dmg_dir/.stage"
          dmg="$dmg_dir/DSH_Launcher_${{ matrix.artifact }}.dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/DSH Launcher.app"
          ln -s /Applications "$stage/Applications"
          rm -f "$dmg"
          hdiutil create -quiet -volname "DSH Launcher" -srcfolder "$stage" -ov -format UDZO "$dmg"
          rm -rf "$stage"

      - name: Rename Windows assets for updater URLs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # GitHub 上传 Release 资产时会把文件名中的空格替换为点号；latest.json 的 URL
          # 使用改后的名字，因此先把 NSIS 产物改名成与最终资产名一致，避免热更 URL 404。
          cd "src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis"
          for f in *" "*; do
            [[ -e "$f" ]] || continue
            mv -f "$f" "${f// /.}"
          done

      - name: Archive AppImage with executable permissions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=$(find "src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod +x "$appimage"
          tar -czf "$appimage.tar.gz" -C "$(dirname "$appimage")" "$(basename "$appimage")"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  verify-windows-shortcut:
    name: Verify Windows desktop shortcut
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-launcher-windows-x64
          path: installer

      - name: Install NSIS package silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer artifact not found" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)" }

      - name: Assert desktop shortcut target
        shell: pwsh
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          $candidates = @(
            (Join-Path $desktop 'DSH Launcher.lnk'),
            (Join-Path $env:PUBLIC 'Desktop\DSH Launcher.lnk')
          )
          $shortcutPath = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $shortcutPath) { throw "Desktop shortcut not found: $($candidates -join ', ')" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ([string]::IsNullOrWhiteSpace($shortcut.TargetPath)) {
            throw "Desktop shortcut target is empty: $shortcutPath"
          }
          if (-not (Test-Path -LiteralPath $shortcut.TargetPath)) {
            throw "Desktop shortcut target does not exist: $($shortcut.TargetPath)"
          }
          Write-Host "$shortcutPath -> $($shortcut.TargetPath)"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - verify-windows-shortcut
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-launcher-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "DSH Launcher $GITHUB_REF_NAME"

      - name: Generate updater latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 把 Release 说明注入 latest.json 的 notes 字段，供应用内更新日志展示。
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-assets/.release-notes.md
          LATEST_NOTES="$(cat release-assets/.release-notes.md)" \
            node scripts/generate-latest-json.mjs release-assets release-assets/latest.json
          rm -f release-assets/.release-notes.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
